services:
  web:
    image: ${APP_IMAGE:?APP_IMAGE must be set by the deployment script}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      DJANGO_DB_PATH: /app/data/db.sqlite3
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-},${PUBLIC_HOST:?PUBLIC_HOST must be set by deploy.sh}"
    volumes:
      - ./data:/app/data
