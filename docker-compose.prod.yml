services:
  web:
    image: ${APP_IMAGE:-car-rental-portal:latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      DJANGO_DB_PATH: /app/data/db.sqlite3
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-},${PUBLIC_HOST:-localhost}"
    volumes:
      - ./data:/app/data
      - ./media:/app/media
