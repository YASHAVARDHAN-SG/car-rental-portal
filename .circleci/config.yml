version: 2.1

jobs:
  build:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Prepare build logs
          command: mkdir -p build-logs
      - run:
          name: Install dependencies
          command: |
            set -o pipefail
            if python -m pip install -r requirements.txt 2>&1 | tee build-logs/dependencies.log; then
              echo success > build-logs/dependencies.status
            else
              echo failed > build-logs/dependencies.status
            fi
      - run:
          name: Compile Python files
          command: |
            set -o pipefail
            if python -m compileall -q manage.py settings.py urls.py car bike bicycle 2>&1 | tee build-logs/compile.log; then
              echo success > build-logs/compile.status
            else
              echo failed > build-logs/compile.status
            fi
      - run:
          name: Check Django configuration
          command: |
            set -o pipefail
            if python manage.py check 2>&1 | tee build-logs/django-check.log; then
              echo success > build-logs/django-check.status
            else
              echo failed > build-logs/django-check.status
            fi
      - store_artifacts:
          path: build-logs
          destination: build-logs
      - run:
          name: Fail if a build step failed
          command: |
            failed=0
            for step in dependencies compile django-check; do
              if [ "$(cat "build-logs/$step.status")" != "success" ]; then
                echo "$step failed; see the build-logs artifact."
                failed=1
              fi
            done
            exit "$failed"

  test:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Prepare test logs
          command: mkdir -p test-logs
      - run:
          name: Install dependencies
          command: |
            set -o pipefail
            if python -m pip install -r requirements.txt 2>&1 | tee test-logs/dependencies.log; then
              echo success > test-logs/dependencies.status
            else
              echo failed > test-logs/dependencies.status
            fi
      - run:
          name: Run Django tests
          command: |
            set -o pipefail
            if [ "$(cat test-logs/dependencies.status)" = "success" ]; then
              if python manage.py test 2>&1 | tee test-logs/tests.log; then
                echo success > test-logs/tests.status
              else
                echo failed > test-logs/tests.status
              fi
            else
              echo "Skipped because dependency installation failed." | tee test-logs/tests.log
              echo failed > test-logs/tests.status
            fi
      - store_artifacts:
          path: test-logs
          destination: test-logs
      - run:
          name: Fail if a test step failed
          command: |
            failed=0
            for step in dependencies tests; do
              if [ "$(cat "test-logs/$step.status")" != "success" ]; then
                echo "$step failed; see the test-logs artifact."
                failed=1
              fi
            done
            exit "$failed"

  sonarqube-analysis:
    docker:
      - image: sonarsource/sonar-scanner-cli:11
        entrypoint: ["/bin/sh", "-c"]
        command: ["tail -f /dev/null"]
    steps:
      - checkout
      - run:
          name: Run SonarQube code analysis
          shell: /bin/sh -eo pipefail
          command: |
            if [ -z "${SONAR_HOST_URL:-}" ] || [ -z "${SONAR_TOKEN:-}" ] || [ -z "${SONAR_PROJECT_KEY:-}" ]; then
              echo "Set SONAR_HOST_URL, SONAR_TOKEN, and SONAR_PROJECT_KEY in CircleCI project environment variables."
              exit 1
            fi
            sonar-scanner \
              -Dsonar.host.url="$SONAR_HOST_URL" \
              -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
              -Dsonar.sources=car,bike,bicycle,templates,static \
              -Dsonar.python.version=3.12 \
              -Dsonar.exclusions="**/migrations/**,**/__pycache__/**,static/image/**"

  security-scan:
    docker:
      - image: aquasec/trivy:0.58.1
        entrypoint: ["/bin/sh", "-c"]
        command: ["tail -f /dev/null"]
    steps:
      - checkout
      - run:
          name: Scan repository with Trivy
          shell: /bin/sh -eo pipefail
          command: |
            mkdir -p security-logs
            set -o pipefail
            if trivy fs \
              --scanners vuln,misconfig,secret \
              --severity HIGH,CRITICAL \
              --exit-code 1 \
              --format table \
              . 2>&1 | tee security-logs/trivy.log; then
              echo success > security-logs/trivy.status
            else
              echo failed > security-logs/trivy.status
            fi
      - store_artifacts:
          path: security-logs
          destination: security-logs
      - run:
          name: Fail if the security scan failed
          shell: /bin/sh -eo pipefail
          command: |
            if [ "$(cat security-logs/trivy.status)" != "success" ]; then
              echo "Trivy found high/critical findings or the scan could not complete; see the security-logs artifact."
              exit 1
            fi

workflows:
  build-and-test:
    jobs:
      - build
      - test:
          requires:
            - build
      - sonarqube-analysis:
          requires:
            - test
      - security-scan:
          requires:
            - sonarqube-analysis
