version: 2.1
                            
jobs:
  build-image:
    machine:
      image: ubuntu-2204:current
    steps:
      - checkout
      - run:
          name: Build application image
          command: |
            docker build --pull --tag "car-rental-portal:$CIRCLE_SHA1" .
            docker save --output /tmp/car-rental-image.tar "car-rental-portal:$CIRCLE_SHA1"
      - persist_to_workspace:
          root: /tmp
          paths:
            - car-rental-image.tar

  unit-tests:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install Python dependencies
          command: |
            python -m pip install --disable-pip-version-check -r requirements.txt
      - run:
          name: Run Django unit tests
          command: |
            python manage.py test

  push-image:
    machine:
      image: ubuntu-2204:current
    environment:
      AWS_ROLE_ARN: arn:aws:iam::027401589480:role/Githubcirclecicarrental
    steps:
      - checkout
      - attach_workspace:
          at: /tmp
      - run:
          name: Ensure AWS CLI is available
          command: |
            if ! command -v aws >/dev/null; then
              curl -sSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
              unzip -q /tmp/awscliv2.zip -d /tmp
              sudo /tmp/aws/install
            fi
            aws --version
      - run:
          name: Assume AWS role via OIDC
          command: |
            if [ -z "${AWS_ROLE_ARN:-}" ]; then
              echo "AWS_ROLE_ARN is empty. Set the IAM role ARN in the build-and-push job environment."
              exit 1
            fi
            if [ -z "${CIRCLE_OIDC_TOKEN_V2:-}" ]; then
              echo "CircleCI did not provide CIRCLE_OIDC_TOKEN_V2. Check CircleCI OIDC availability and the IAM role trust policy."
              exit 1
            fi
            CREDS=$(aws sts assume-role-with-web-identity \
              --role-arn "$AWS_ROLE_ARN" \
              --role-session-name "circleci-$CIRCLE_WORKFLOW_JOB_ID" \
              --web-identity-token "$CIRCLE_OIDC_TOKEN_V2" \
              --duration-seconds 3600 \
              --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
              --output text)
            AK=$(printf '%s\n' "$CREDS" | cut -f1)
            SK=$(printf '%s\n' "$CREDS" | cut -f2)
            ST=$(printf '%s\n' "$CREDS" | cut -f3)
            echo "export AWS_ACCESS_KEY_ID=$AK" >> "$BASH_ENV"
            echo "export AWS_SECRET_ACCESS_KEY=$SK" >> "$BASH_ENV"
            echo "export AWS_SESSION_TOKEN=$ST" >> "$BASH_ENV"
      - run:
          name: Log in to ECR and load built image
          command: |
            if [ -z "${AWS_REGION:-}" ] || [ -z "${ECR_REGISTRY:-}" ] || [ -z "${ECR_REPOSITORY:-}" ]; then
              echo "Set AWS_REGION, ECR_REGISTRY, and ECR_REPOSITORY in CircleCI project environment variables."
              exit 1
            fi
            docker load --input /tmp/car-rental-image.tar
            docker tag "car-rental-portal:$CIRCLE_SHA1" "$ECR_REGISTRY/$ECR_REPOSITORY:$CIRCLE_SHA1"
            docker tag "car-rental-portal:$CIRCLE_SHA1" "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
            aws ecr get-login-password --region "$AWS_REGION" \
              | docker login --username AWS --password-stdin "$ECR_REGISTRY"
      - run:
          name: Push image
          command: |
            docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$CIRCLE_SHA1"
            docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

  deploy:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - add_ssh_keys:
          fingerprints:
            - "SHA256:Z5O6VBR43pliobaMddwCKte6C9rLQG+BzTQ+1meVEN4"
      - run:
          name: Trust EC2 host key
          command: |
            mkdir -p ~/.ssh
            ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
      - run:
          name: Copy compose file and deploy script
          command: |
            ssh "$EC2_USER@$EC2_HOST" "mkdir -p car-rental"
            scp docker-compose.prod.yml deploy/deploy.sh deploy/nginx.conf "$EC2_USER@$EC2_HOST:car-rental/"
      - run:
          name: Run deploy on EC2
          command: |
            ssh "$EC2_USER@$EC2_HOST" \
              "AWS_REGION=$AWS_REGION ECR_REGISTRY=$ECR_REGISTRY ECR_REPOSITORY=$ECR_REPOSITORY IMAGE_TAG=$CIRCLE_SHA1 bash car-rental/deploy.sh"
      - run:
          name: Smoke test
          command: curl --retry 10 --retry-delay 5 --retry-connrefused -fsS -o /dev/null "http://$EC2_HOST/"

workflows:
  ci-cd:
    jobs:
      - build-image
      - unit-tests:
          requires: [build-image]
      - push-image:
          requires: [unit-tests]
          filters:
            branches:
              only: main
      - deploy:
          requires: [push-image]
          filters:
            branches:
              only: main