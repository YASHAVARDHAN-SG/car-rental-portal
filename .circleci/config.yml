version: 2.1
                            
jobs:
  lint:
    docker:
      - image: cimg/php:8.2
    steps:
      - checkout
      - run:
          name: PHP syntax check
          command: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

  build-and-push:
    machine:
      image: ubuntu-2204:current
    environment:
      AWS_ROLE_ARN: arn:aws:iam::027401589480:role/Githubcirclecicarrental
    steps:
      - checkout
      - run:
          name: Ensure AWS CLI is available
          command: |
            if ! command -v aws >/dev/null; then
              curl -sSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
              unzip -q /tmp/awscliv2.zip -d /tmp
              sudo /tmp/aws/install
            fi
            aws --version
      - run:
          name: Debug OIDC token claims
          command: |
            python3 -c "import os,base64,json;p=os.environ['CIRCLE_OIDC_TOKEN_V2'].split('.')[1];p+='='*(-len(p)%4);print(json.dumps(json.loads(base64.urlsafe_b64decode(p)),indent=2))"
      - run:
          name: Assume AWS role via OIDC
          command: |
            if [ -z "${AWS_ROLE_ARN:-}" ]; then
              echo "AWS_ROLE_ARN is empty. Set the IAM role ARN in the build-and-push job environment."
              exit 1
            fi
            if [ -z "${CIRCLE_OIDC_TOKEN_V2:-}" ]; then
              echo "CircleCI did not provide CIRCLE_OIDC_TOKEN_V2. Check CircleCI OIDC availability and the IAM role trust policy."
              exit 1
            fi
            CREDS=$(aws sts assume-role-with-web-identity \
              --role-arn "$AWS_ROLE_ARN" \
              --role-session-name "circleci-$CIRCLE_WORKFLOW_JOB_ID" \
              --web-identity-token "$CIRCLE_OIDC_TOKEN_V2" \
              --duration-seconds 3600 \
              --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
              --output text)
            AK=$(printf '%s\n' "$CREDS" | cut -f1)
            SK=$(printf '%s\n' "$CREDS" | cut -f2)
            ST=$(printf '%s\n' "$CREDS" | cut -f3)
            echo "export AWS_ACCESS_KEY_ID=$AK" >> "$BASH_ENV"
            echo "export AWS_SECRET_ACCESS_KEY=$SK" >> "$BASH_ENV"
            echo "export AWS_SESSION_TOKEN=$ST" >> "$BASH_ENV"
      - run:
          name: Log in to ECR
          command: |
            aws ecr get-login-password --region "$AWS_REGION" \
              | docker login --username AWS --password-stdin "$ECR_REGISTRY"
      - run:
          name: Build image
          command: |
            docker build \
              -t "$ECR_REGISTRY/$ECR_REPOSITORY:$CIRCLE_SHA1" \
              -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" .
      - run:
          name: Push image
          command: |
            docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$CIRCLE_SHA1"
            docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

  deploy:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - add_ssh_keys:
          fingerprints:
            - "SHA256:REPLACE_WITH_YOUR_KEY_FINGERPRINT"
      - run:
          name: Trust EC2 host key
          command: |
            mkdir -p ~/.ssh
            ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
      - run:
          name: Copy compose file and deploy script
          command: |
            scp docker-compose.prod.yml deploy/deploy.sh "$EC2_USER@$EC2_HOST:car-rental/"
      - run:
          name: Run deploy on EC2
          command: |
            ssh "$EC2_USER@$EC2_HOST" \
              "AWS_REGION=$AWS_REGION ECR_REGISTRY=$ECR_REGISTRY ECR_REPOSITORY=$ECR_REPOSITORY IMAGE_TAG=$CIRCLE_SHA1 bash car-rental/deploy.sh"
      - run:
          name: Smoke test
          command: curl --retry 10 --retry-delay 5 --retry-connrefused -fsS -o /dev/null "http://$EC2_HOST/"

workflows:
  ci-cd:
    jobs:
      - lint
      - build-and-push:
          requires: [lint]
          filters:
            branches:
              only: main
      - deploy:
          requires: [build-and-push]
          filters:
            branches:
              only: main